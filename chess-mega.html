<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#19170f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Шахматный год · 1100 часов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#19170f; --panel:#221f17; --panel-2:#2a2619; --line:#3a3526;
    --ivory:#ECE4D2; --ivory-dim:#A9A08C; --wood:#7A4B2B; --wood-dim:#5A3A22;
    --gold:#C9A227; --gold-dim:#8C7320; --felt:#46684F; --felt-bright:#5C8A66;
    --emerald:#4FB35F; --empty:#33301F; --danger:#A35A4A;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ivory);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:920px;margin:0 auto;padding:32px 20px 100px;}
  h1,h2,h3{font-family:'Spectral',serif;font-weight:600;margin:0;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;}
  header{margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:24px;}
  header h1{font-size:30px;color:var(--ivory);}
  header p{color:var(--ivory-dim);font-size:14px;margin-top:6px;}
  .badge-row{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .badge{font-size:11.5px;font-family:'JetBrains Mono',monospace;padding:5px 10px;border-radius:6px;border:1px solid var(--line);color:var(--ivory-dim);}
  .badge.cloud{border-color:var(--felt);color:var(--felt-bright);}
  .badge.local{border-color:var(--gold-dim);color:var(--gold);}
  .toolbtn{background:var(--panel-2);border:1px solid var(--line);color:var(--ivory);border-radius:7px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;transition:border-color .2s;}
  .toolbtn:hover{border-color:var(--gold-dim);}
  .toolbtn.active{border-color:var(--felt-bright);color:var(--felt-bright);}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:24px 0;}
  .stat{background:var(--panel);padding:16px 18px;}
  .stat .label{font-size:11px;color:var(--ivory-dim);text-transform:uppercase;letter-spacing:.06em;}
  .stat .value{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:600;color:var(--ivory);margin-top:6px;}
  .stat .value small{font-size:13px;color:var(--ivory-dim);font-weight:500;}

  .goalbar{margin-bottom:32px;}
  .goalbar .row{display:flex;justify-content:space-between;font-size:13px;color:var(--ivory-dim);margin-bottom:8px;}
  .goalbar .row b{color:var(--gold);font-family:'JetBrains Mono',monospace;}
  .track{height:10px;background:var(--empty);border-radius:6px;overflow:hidden;border:1px solid var(--line);}
  .fill{height:100%;background:linear-gradient(90deg,var(--wood),var(--gold));border-radius:6px 0 0 6px;transition:width .4s;}

  section{margin-bottom:32px;}
  .sec-title{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .sec-title .icon{color:var(--gold);font-size:18px;}
  .sec-title h2{font-size:17px;color:var(--ivory);}

  .achv-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;}
  .achv{flex:0 0 auto;width:128px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 10px;text-align:center;opacity:.4;filter:grayscale(1);transition:opacity .3s,filter .3s;}
  .achv.unlocked{opacity:1;filter:none;border-color:var(--gold-dim);background:var(--panel-2);}
  .achv .glyph{font-size:22px;color:var(--gold);margin-bottom:6px;display:block;}
  .achv .name{font-size:11.5px;font-weight:500;color:var(--ivory);line-height:1.3;}
  .achv .desc{font-size:10.5px;color:var(--ivory-dim);margin-top:3px;line-height:1.3;}

  /* CALENDAR */
  .heatwrap{overflow-x:auto;padding-bottom:8px;position:relative;}
  .heatgrid{display:grid;grid-auto-flow:column;grid-template-rows:14px repeat(7,15px);gap:3px;width:max-content;}
  .mlabel{font-size:10px;color:var(--ivory-dim);font-family:'JetBrains Mono',monospace;grid-row:1;align-self:end;padding-bottom:2px;}
  .cell{display:inline-block;width:15px;height:15px;border-radius:3px;cursor:pointer;position:relative;transition:transform .1s;vertical-align:middle;}
  .cell:not(.future):hover{transform:scale(1.4);z-index:2;}
  .cell.future{cursor:default;opacity:.4;}
  .cell.today{outline:1.5px solid var(--gold);outline-offset:1px;}
  .legend{display:flex;align-items:center;gap:14px;margin-top:12px;font-size:11px;color:var(--ivory-dim);flex-wrap:wrap;}
  .legend .swatch{display:flex;align-items:center;gap:6px;}
  .legend .cell{cursor:default;width:12px;height:12px;}
  .legend .cell:hover{transform:none;}

  #calTooltip{position:fixed;background:var(--panel-2);color:var(--ivory);font-size:12px;padding:6px 10px;border-radius:7px;border:1px solid var(--line);pointer-events:none;z-index:50;white-space:nowrap;opacity:0;transition:opacity .15s;box-shadow:0 4px 14px rgba(0,0,0,.5);}

  /* Day popup */
  .day-popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:center;justify-content:center;}
  .day-popup{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 24px;min-width:320px;max-width:90vw;box-shadow:0 10px 40px rgba(0,0,0,.6);}
  .day-popup h3{font-size:17px;margin-bottom:4px;}
  .day-popup .popup-sub{font-size:12px;color:var(--ivory-dim);margin-bottom:16px;}
  .day-popup .popup-row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line);}
  .day-popup .popup-row:last-of-type{border:none;}
  .day-popup .popup-row .lbl{color:var(--ivory-dim);}
  .day-popup .popup-row .val{font-family:'JetBrains Mono',monospace;color:var(--ivory);}
  .day-popup .popup-total{display:flex;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid var(--gold-dim);font-size:14px;}
  .day-popup .popup-total .val{font-family:'JetBrains Mono',monospace;color:var(--gold);font-size:16px;}
  .day-popup .popup-btns{display:flex;gap:8px;margin-top:16px;}
  .day-popup .popup-btns button{flex:1;padding:9px;border-radius:8px;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;}
  .popup-edit{background:var(--felt);border:1px solid var(--felt-bright);color:var(--ivory);}
  .popup-edit:hover{background:var(--felt-bright);}
  .popup-close{background:var(--panel-2);border:1px solid var(--line);color:var(--ivory-dim);}
  .popup-close:hover{border-color:var(--gold-dim);}

  .editor{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;}
  .editor-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .editor-head h3{font-size:18px;color:var(--ivory);}
  .nav-btns{display:flex;gap:6px;}
  .nav-btns button{background:var(--panel-2);border:1px solid var(--line);color:var(--ivory);border-radius:7px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;}
  .nav-btns button:hover{border-color:var(--gold-dim);}

  .task{display:grid;grid-template-columns:26px 1fr 110px;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);}
  .task:last-of-type{border-bottom:none;}
  .task .chk{width:20px;height:20px;cursor:pointer;accent-color:var(--felt-bright);}
  .task .info b{display:block;font-size:14px;color:var(--ivory);}
  .task .info span{display:block;font-size:11.5px;color:var(--ivory-dim);margin-top:2px;}
  .task input[type=number]{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ivory);border-radius:7px;padding:7px 8px;font-family:'JetBrains Mono',monospace;font-size:13px;text-align:right;}
  .task input[type=number]:focus{outline:none;border-color:var(--gold-dim);}
  .unit{font-size:11px;color:var(--ivory-dim);margin-left:4px;}

  .daytotal{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap;gap:8px;}
  .daytotal .num{font-family:'JetBrains Mono',monospace;font-size:20px;color:var(--gold);font-weight:600;}
  .savemsg{font-size:12px;color:var(--felt-bright);opacity:0;transition:opacity .3s;}
  .savemsg.show{opacity:1;}
  .savemsg.err{color:var(--danger);}

  .loading{text-align:center;padding:60px 0;color:var(--ivory-dim);font-family:'JetBrains Mono',monospace;font-size:13px;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel-2);border:1px solid var(--gold-dim);border-radius:10px;padding:14px 20px;display:flex;align-items:center;gap:12px;opacity:0;transition:opacity .3s,transform .3s;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:90vw;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast .glyph{font-size:24px;color:var(--gold);}
  .toast b{display:block;font-size:13px;color:var(--ivory);}
  .toast span{font-size:11.5px;color:var(--ivory-dim);}

  #importInput{display:none;}

  /* GAMIFICATION */
  .levelhud{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:16px;}
  .levelhud .rank-icon{font-size:30px;color:var(--gold);width:42px;text-align:center;flex:0 0 auto;}
  .levelhud .lvl-main{flex:1;min-width:0;}
  .levelhud .lvl-top{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--ivory-dim);margin-bottom:6px;}
  .levelhud .lvl-top b{color:var(--ivory);font-family:'JetBrains Mono',monospace;}
  .xptrack{height:8px;background:var(--empty);border-radius:5px;overflow:hidden;border:1px solid var(--line);}
  .xpfill{height:100%;background:linear-gradient(90deg,var(--felt),var(--emerald));border-radius:5px;transition:width .5s cubic-bezier(.2,.8,.3,1);}
  .combo-pill{font-size:11px;font-family:'JetBrains Mono',monospace;background:var(--panel-2);border:1px solid var(--gold-dim);color:var(--gold);padding:5px 10px;border-radius:20px;white-space:nowrap;flex:0 0 auto;}
  .shield-pill{font-size:11px;font-family:'JetBrains Mono',monospace;background:var(--panel-2);border:1px solid #4a7ab5;color:#7ab3f0;padding:5px 10px;border-radius:20px;white-space:nowrap;flex:0 0 auto;cursor:pointer;transition:background .2s;}
  .shield-pill:hover{background:#1a2a3a;}
  .mute-btn{width:34px;padding:6px 0;text-align:center;}

  .risk-banner{display:flex;align-items:center;gap:12px;background:var(--panel-2);border:1px solid var(--gold-dim);border-radius:10px;padding:12px 16px;margin-bottom:18px;animation:riskPulse 2.4s infinite;}
  .risk-banner .flame{font-size:22px;flex:0 0 auto;}
  .risk-banner b{color:var(--gold);}
  @keyframes riskPulse{0%,100%{box-shadow:0 0 0 rgba(201,162,39,0);}50%{box-shadow:0 0 16px rgba(201,162,39,.35);}}

  .xp-float{position:fixed;transform:translate(-50%,0);font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;color:var(--gold);pointer-events:none;z-index:65;animation:xpFloat .9s ease-out forwards;}
  .xp-float.crit{color:var(--emerald);font-size:16px;}
  @keyframes xpFloat{0%{opacity:0;transform:translate(-50%,0) scale(.8);}15%{opacity:1;transform:translate(-50%,-14px) scale(1.1);}100%{opacity:0;transform:translate(-50%,-62px) scale(1);}}

  .confetti-piece{position:fixed;border-radius:2px;pointer-events:none;z-index:64;animation:confettiBurst .85s ease-out forwards;}
  @keyframes confettiBurst{0%{opacity:1;transform:translate(0,0) rotate(0deg);}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(220deg);}}

  .levelup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:170;display:flex;align-items:center;justify-content:center;}
  .levelup-card{background:linear-gradient(160deg,var(--panel-2),var(--panel));border:1px solid var(--gold);border-radius:18px;padding:34px 40px;text-align:center;box-shadow:0 0 60px rgba(201,162,39,.35),0 20px 50px rgba(0,0,0,.6);animation:levelPop .45s cubic-bezier(.34,1.56,.64,1);}
  .levelup-card .lvl-icon{font-size:50px;color:var(--gold);display:block;margin-bottom:8px;}
  .levelup-card h2{font-size:27px;color:var(--ivory);margin-bottom:4px;}
  .levelup-card .lvl-rank{font-size:14px;color:var(--gold);margin-bottom:20px;letter-spacing:.04em;text-transform:uppercase;}
  .levelup-card button{background:var(--felt);border:1px solid var(--felt-bright);color:var(--ivory);padding:10px 24px;border-radius:9px;cursor:pointer;font-size:14px;font-family:'Inter',sans-serif;}
  .levelup-card button:hover{background:var(--felt-bright);}
  @keyframes levelPop{0%{transform:scale(.5);opacity:0;}100%{transform:scale(1);opacity:1;}}

  /* ── BOSS FIGHT ── */
  .boss-section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:32px;}
  .boss-header{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
  .boss-avatar{font-size:36px;width:52px;height:52px;display:flex;align-items:center;justify-content:center;background:var(--panel-2);border-radius:50%;border:2px solid var(--danger);flex-shrink:0;}
  .boss-info h3{font-size:16px;color:var(--ivory);margin-bottom:2px;}
  .boss-info .boss-rating{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--danger);letter-spacing:.08em;}
  .boss-hp-label{display:flex;justify-content:space-between;font-size:11px;color:var(--ivory-dim);margin-bottom:6px;}
  .boss-hp-track{height:14px;background:var(--empty);border-radius:7px;overflow:hidden;border:1px solid var(--line);position:relative;}
  .boss-hp-fill{height:100%;border-radius:7px;transition:width .6s cubic-bezier(.2,.8,.3,1);background:linear-gradient(90deg,#8B1A1A,var(--danger));}
  .boss-status{font-size:12px;color:var(--ivory-dim);margin-top:8px;}
  .boss-dead{text-align:center;padding:10px;animation:bossVictory 1s ease-out;}
  @keyframes bossVictory{0%{transform:scale(.8);opacity:0;}100%{transform:scale(1);opacity:1;}}

  /* ── CHESS BOARD PROGRESS ── */
  .board-progress{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;max-width:320px;}
  .board-cell{aspect-ratio:1;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;transition:transform .15s;position:relative;}
  .board-cell:hover{transform:scale(1.1);z-index:2;}
  .board-cell.light-sq{background:#3a3526;}
  .board-cell.dark-sq{background:#2a2619;}
  .board-cell.filled-base{background:var(--wood-dim);}
  .board-cell.filled-mid{background:var(--felt);}
  .board-cell.filled-great{background:var(--felt-bright);}
  .board-cell.filled-epic{background:var(--gold);}
  .board-cell.current-week{outline:2px solid var(--gold);outline-offset:1px;}
  .board-tooltip{position:fixed;background:var(--panel-2);color:var(--ivory);font-size:11px;padding:5px 9px;border-radius:6px;border:1px solid var(--line);pointer-events:none;z-index:50;opacity:0;transition:opacity .15s;white-space:nowrap;}

  /* ── CHARTS ── */
  .chart-container{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px;}
  .chart-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .chart-tab{padding:6px 14px;border-radius:20px;border:1px solid var(--line);background:var(--panel-2);color:var(--ivory-dim);font-size:12px;cursor:pointer;transition:all .2s;}
  .chart-tab.active{background:var(--gold);border-color:var(--gold);color:#19170f;font-weight:600;}
  .forecast-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:14px;}
  .forecast-card{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;}
  .forecast-card .fc-label{font-size:11px;color:var(--ivory-dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
  .forecast-card .fc-value{font-family:'JetBrains Mono',monospace;font-size:18px;color:var(--gold);font-weight:600;}
  .forecast-card .fc-sub{font-size:11px;color:var(--ivory-dim);margin-top:2px;}

  /* ── DAILY CHALLENGE ── */
  .daily-challenge{background:var(--panel-2);border:1px solid var(--gold-dim);border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:14px;}
  .daily-challenge .dc-icon{font-size:28px;flex-shrink:0;}
  .daily-challenge .dc-body{flex:1;}
  .daily-challenge .dc-label{font-size:10px;color:var(--gold);text-transform:uppercase;letter-spacing:.1em;font-family:'JetBrains Mono',monospace;}
  .daily-challenge .dc-text{font-size:14px;color:var(--ivory);margin-top:2px;}
  .daily-challenge .dc-bonus{font-size:11px;color:var(--emerald);margin-top:3px;}
  .dc-done-btn{padding:7px 14px;border-radius:7px;background:var(--felt);border:1px solid var(--felt-bright);color:var(--ivory);font-size:12px;cursor:pointer;white-space:nowrap;}
  .dc-done-btn:disabled{opacity:.4;cursor:default;}

  /* ── AI COACH ── */
  .ai-coach-popup{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:160;display:flex;align-items:flex-end;justify-content:center;}
  .ai-coach-card{background:var(--panel);border:1px solid var(--gold-dim);border-radius:18px 18px 0 0;padding:24px 24px 36px;max-width:600px;width:100%;max-height:70vh;overflow-y:auto;animation:slideUp .3s ease-out;}
  @keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .ai-coach-card h3{font-size:18px;color:var(--gold);margin-bottom:12px;}
  .ai-coach-card .coach-text{font-size:14px;color:var(--ivory);line-height:1.7;white-space:pre-wrap;}
  .ai-coach-card .coach-loading{color:var(--ivory-dim);font-size:13px;font-family:'JetBrains Mono',monospace;}
  .ai-coach-close{position:absolute;top:16px;right:20px;background:none;border:none;color:var(--ivory-dim);font-size:22px;cursor:pointer;}

  /* ── PHOENIX / COMEBACK ── */
  @keyframes phoenixFlash{0%{opacity:0;}20%{opacity:.6;}100%{opacity:0;}}
  .phoenix-overlay{position:fixed;inset:0;background:linear-gradient(135deg,#ff6a00,#ee0979);pointer-events:none;z-index:150;opacity:0;animation:phoenixFlash 1.5s ease-out forwards;}

  /* ── SHIELD ANIMATION ── */
  @keyframes shieldAbsorb{0%{transform:scale(1);}30%{transform:scale(1.3);}60%{transform:scale(0.9);}100%{transform:scale(1);}}
  .shield-anim{animation:shieldAbsorb .6s ease-out;}

  /* ── BREAKTHROUGH PIECE ── */
  .breakthrough-piece{position:fixed;font-size:48px;pointer-events:none;z-index:160;animation:breakthroughMove 1.4s cubic-bezier(.25,.46,.45,.94) forwards;}
  @keyframes breakthroughMove{
    0%{left:10%;top:80%;opacity:0;transform:scale(0.5) rotate(0deg);}
    30%{opacity:1;transform:scale(1.2) rotate(-15deg);}
    60%{left:50%;top:40%;transform:scale(1.1) rotate(10deg);}
    100%{left:50%;top:45%;opacity:0;transform:scale(2) rotate(0deg);}
  }

  /* ── PWA INSTALL BANNER ── */
  .install-banner{display:none;background:var(--panel-2);border:1px solid var(--felt);border-radius:10px;padding:12px 16px;margin-bottom:16px;align-items:center;gap:12px;}
  .install-banner.show{display:flex;}
  .install-banner button{padding:6px 14px;background:var(--felt);border:1px solid var(--felt-bright);color:var(--ivory);border-radius:7px;font-size:12px;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading" id="loading">загрузка плана…</div>
</div>
<div class="toast" id="toast"></div>
<div id="calTooltip"></div>
<div id="boardTooltip" class="board-tooltip"></div>
<input type="file" id="importInput" accept="application/json">

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// ─── SERVICE WORKER для PUSH уведомлений ────────────────────────────────────
if('serviceWorker' in navigator){
  const swCode = `
self.addEventListener('install', e => self.skipWaiting());
self.addEventListener('activate', e => e.waitUntil(clients.claim()));
self.addEventListener('push', e => {
  const d = e.data ? e.data.json() : {title:'Шахматный год', body:'Время тренироваться!'};
  e.waitUntil(self.registration.showNotification(d.title, {

function ensureAudio(){

function playTone(freq,dur,type,vol,delay){
  if(!state.soundOn) return;
  const ctx = ensureAudio(); if(!ctx) return;
  const t0 = ctx.currentTime+(delay||0);
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = type||'sine';
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(vol||0.05, t0+0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0); osc.stop(t0+dur+0.02);
}

// ─── STATS ───────────────────────────────────────────────────────────────────
function computeStats(){
  const START=parseDate(state.startDate);
  let totalMin=0, games=0, activeDays=0, bookSessions=0, broadcastSessions=0;
  const completeSet=new Set();
  Object.keys(state.days).forEach(ds=>{
    const d=state.days[ds]; const m=dayMinutes(d);
    totalMin+=m; games+=d.games.count||0; if(m>0) activeDays++;
    if(d.books&&d.books.done) bookSessions++;
    if(d.broadcast&&d.broadcast.done) broadcastSessions++;
    if(dayComplete(d)) completeSet.add(ds);
  });
  let bestStreak=0, run=0;
  for(let i=0;i<TOTAL_DAYS;i++){ const ds=fmt(addDays(START,i)); if(completeSet.has(ds)){run++;bestStreak=Math.max(bestStreak,run);}else run=0; }
  let currentStreak=0;
  const today=startOfDay(new Date());
  for(let i=TOTAL_DAYS-1;i>=0;i--){ const d=addDays(START,i); if(d>today) continue; const ds=fmt(d); if(completeSet.has(ds)) currentStreak++; else if(ds!==fmt(today)) break; }
  return {totalMin, totalHours:totalMin/60, games, activeDays, bookSessions, broadcastSessions, bestStreak, currentStreak};
}

// ─── WEEKLY STATS ─────────────────────────────────────────────────────────────
function computeWeeklyData(){
  const START = parseDate(state.startDate);
  const weeks = [];
  for(let w=0; w<52; w++){
    let wMin=0, tactics=0, opening=0, games=0, endgame=0, days=0;
    for(let d=0; d<7; d++){
      const ds = fmt(addDays(START, w*7+d));
      const day = state.days[ds];
      if(!day) continue;
      const m = dayMinutes(day);
      wMin += m; days++;
      tactics  += day.tactics.min||0;
      opening  += day.opening.min||0;
      games    += (day.games.count||0)*20;
      endgame  += day.endgame.min||0;
    }
    weeks.push({week:w+1, hours:wMin/60, tactics:tactics/60, opening:opening/60, games:games/60, endgame:endgame/60, days});
  }
  return weeks;
}

  if(!state.pushEnabled || Notification.permission !== 'granted') return;
  // Morning reminder at 9:00
  const now = new Date();
  const morning = new Date(); morning.setHours(9,0,0,0);
  if(morning < now) morning.setDate(morning.getDate()+1);
  const msToMorning = morning - now;
  setTimeout(()=>{
    new Notification('♟ Шахматный год', {body:'Доброе утро! Пора разминать мозг — открой план тренировки.',tag:'chess-morning'});
    setInterval(()=> new Notification('♟ Шахматный год', {body:'Доброе утро! Пора разминать мозг.',tag:'chess-morning'}), 86400000);
  }, msToMorning);

  // Evening streak-risk at 20:00
  const evening = new Date(); evening.setHours(20,0,0,0);
  if(evening < now) evening.setDate(evening.getDate()+1);
  const msToEvening = evening - now;
  setTimeout(()=>{
    checkEveningAlert();
    setInterval(checkEveningAlert, 86400000);
  }, msToEvening);
}

function checkEveningAlert(){
  const stats = computeStats();
  const todayStr = fmt(startOfDay(new Date()));
  const todayDone = dayComplete(state.days[todayStr]);
  if(stats.currentStreak > 0 && !todayDone && Notification.permission==='granted'){
    new Notification(`🔥 Серия ${stats.currentStreak} дней горит!`, {
      body:'До конца дня — закрой план тренировки чтобы не потерять серию!',
      tag:'chess-evening', requireInteraction:true
    });
  }
}

function sendLevelUpNotification(level){

}

// ─── BOSS FIGHT ───────────────────────────────────────────────────────────────
function getBossHP(){
  const wk = getWeekKey();
  const boss = getWeekBoss();
  // Week plan: 7 complete days = boss dead. Current week complete days
  const START = parseDate(state.startDate);
  const now = new Date();
  const weekStart = new Date(now); weekStart.setDate(now.getDate() - now.getDay() + 1); weekStart.setHours(0,0,0,0);
  let completedThisWeek = 0;
  for(let d=0; d<7; d++){
    const day = addDays(weekStart, d);
    if(day > now) break;
    const ds = fmt(day);
    if(dayComplete(state.days[ds])) completedThisWeek++;
  }
  const maxHP = 7;
  const hp = Math.max(0, maxHP - completedThisWeek);
  return {hp, maxHP, pct: hp/maxHP*100, completedThisWeek, boss};
}

  Chart.defaults.color = '#A9A08C';
  Chart.defaults.borderColor = '#3a3526';
  Chart.defaults.font.family = 'Inter, sans-serif';

  // Weekly chart
  const wLabels = weeks.filter(w=>w.hours>0).map(w=>`Нед ${w.week}`);

  const ctxW = document.getElementById('canvasWeekly');
  if(ctxW) weeklyChart = new Chart(ctxW, {
    type:'line',
    data:{
      labels: wLabels,
      datasets:[{
        label:'Часов в неделю',
        data: wData,
        borderColor:'#C9A227',
        backgroundColor:'rgba(201,162,39,0.1)',
        tension:0.4, fill:true, pointRadius:4, pointHoverRadius:7,
        pointBackgroundColor:'#C9A227'

        data: wLabels.map(()=>21),

        borderDash:[6,4], pointRadius:0, fill:false
      }]
    },

// ─── CALENDAR ─────────────────────────────────────────────────────────────────
function buildHeatgrid(){
  const START  = parseDate(state.startDate);
  const grid   = document.getElementById('heatgrid');
  const today  = startOfDay(new Date());
  const firstWd= (START.getDay()+6)%7;
  let html = '';
  for(let i=0;i<firstWd;i++) html += `<div></div>`;
  for(let i=0;i<TOTAL_DAYS;i++){
    const d  = addDays(START,i);
    const ds = fmt(d);
    const col= Math.floor((i+firstWd)/7);
    const wd = (d.getDay()+6)%7;
    if(wd===0 && d.getDate()<=7){ html += `<div class="mlabel" style="grid-column:${col+1}">${MONTHS_RU[d.getMonth()]}</div>`; }
    const mins    = dayMinutes(state.days[ds]);
    const isFuture= d>today;
    const isToday = ds===fmt(today);
    html += `<div class="cell ${isFuture?'future':''} ${isToday?'today':''}" style="grid-row:${wd+2};grid-column:${col+1};background:${colorForMinutes(mins)}" data-date="${ds}" data-mins="${mins}"></div>`;
  }
  grid.innerHTML = html;
  const tip = document.getElementById('calTooltip');
  grid.querySelectorAll('.cell[data-date]').forEach(c=>{
    c.addEventListener('mouseenter', e=>{
      const d=parseDate(c.dataset.date), mins=parseInt(c.dataset.mins)||0;
      const dayD=state.days[c.dataset.date];
      let detail='';
      if(dayD){ const parts=[]; if(dayD.tactics&&dayD.tactics.min>0) parts.push(`♟ ${dayD.tactics.min}м`); if(dayD.opening&&dayD.opening.min>0) parts.push(`♞ ${dayD.opening.min}м`); if(dayD.games&&dayD.games.count>0) parts.push(`♜ ${dayD.games.count}шт`); if(parts.length) detail='<br><span style="color:var(--ivory-dim)">'+parts.join(' · ')+'</span>'; }
      tip.innerHTML=`<b>${fmtRu(d)}</b> · ${mins} мин (${fmtHours(mins)} ч)${detail}`; tip.style.opacity='1'; moveTip(e);
    });
    c.addEventListener('mousemove', moveTip);
    c.addEventListener('mouseleave', ()=>{ tip.style.opacity='0'; });
    if(!c.classList.contains('future')) c.addEventListener('click',()=>openDayPopup(c.dataset.date));
  });
}
function moveTip(e){ const tip=document.getElementById('calTooltip'); let x=e.clientX+14,y=e.clientY-36; if(x+240>window.innerWidth) x=e.clientX-250; if(y<8) y=e.clientY+20; tip.style.left=x+'px'; tip.style.top=y+'px'; }

// ─── BOARD PROGRESS ───────────────────────────────────────────────────────────
function buildBoardProgress(){
  const weeks = computeWeeklyData();
  const START = parseDate(state.startDate);
  const now = new Date();
  const currentWeek = Math.floor((now - parseDate(state.startDate)) / (86400000*7));
  const board = document.getElementById('boardProgress');
  if(!board) return;
  let html='';
  for(let r=0;r<8;r++){
    for(let c=0;c<8;c++){
      const w = r*8+c;
      const isLight = (r+c)%2===0;
      const weekData = weeks[w];
      const isCurrent = w===currentWeek;
      let cls='board-cell '+(isLight?'light-sq':'dark-sq');
      let piece='';
      if(weekData && weekData.hours>0){
        if(weekData.hours>=20){ cls+=' filled-epic'; piece='♛'; }
        else if(weekData.hours>=15){ cls+=' filled-great'; piece='♝'; }
        else if(weekData.hours>=10){ cls+=' filled-mid'; piece='♞'; }
        else { cls+=' filled-base'; piece='♟'; }
      }
      if(isCurrent) cls+=' current-week';
      html+=`<div class="${cls}" data-week="${w+1}" data-hours="${weekData?weekData.hours.toFixed(1):0}">${piece}</div>`;
    }
  }
  board.innerHTML=html;
  const btip=document.getElementById('boardTooltip');
  board.querySelectorAll('.board-cell').forEach(c=>{
    c.addEventListener('mouseenter',e=>{
      const w=c.dataset.week, h=c.dataset.hours;
      btip.textContent=`Неделя ${w}: ${h} ч`;
      btip.style.opacity='1';
      btip.style.left=(e.clientX+12)+'px'; btip.style.top=(e.clientY-30)+'px';
    });
    c.addEventListener('mousemove',e=>{ btip.style.left=(e.clientX+12)+'px'; btip.style.top=(e.clientY-30)+'px'; });
    c.addEventListener('mouseleave',()=>{ btip.style.opacity='0'; });
  });
}

// ─── DAY POPUP ───────────────────────────────────────────────────────────────
function openDayPopup(ds){
  const d=parseDate(ds), dayD=state.days[ds]||emptyDay(), mins=dayMinutes(dayD);
  const rows=PLAN.map(p=>{ if(p.type==='check'){ const f=dayD[p.key]; if(!f||(!f.done&&!f.min)) return ''; return `<div class="popup-row"><span class="lbl">${p.glyph} ${p.name}</span><span class="val">${f.done?'✓':''} ${f.min||0} мин</span></div>`; }else{ const f=dayD[p.key]; if(!f||!f.count) return ''; return `<div class="popup-row"><span class="lbl">${p.glyph} ${p.name}</span><span class="val">${f.count} шт · ${f.count*20} мин</span></div>`; } }).filter(Boolean).join('');
  const overlay=document.createElement('div'); overlay.className='day-popup-overlay';
  overlay.innerHTML=`<div class="day-popup"><h3>${fmtRu(d)}</h3><div class="popup-sub">${WD_RU[(d.getDay()+6)%7]} · ${dayComplete(dayD)?'✅ день засчитан':'⬜ не засчитан'}</div>${rows||'<div style="color:var(--ivory-dim);font-size:13px;padding:10px 0">нет записей</div>'}<div class="popup-total"><span>Итого</span><span class="val">${mins} мин · ${fmtHours(mins)} ч</span></div><div class="popup-btns"><button class="popup-edit" id="popupEdit">✎ редактировать</button><button class="popup-close" id="popupClose">закрыть</button></div></div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#popupClose').onclick=()=>overlay.remove();
  overlay.querySelector('#popupEdit').onclick=()=>{ overlay.remove(); selectedDate=ds; buildEditor(); document.getElementById('editor').scrollIntoView({behavior:'smooth',block:'center'}); };
  overlay.addEventListener('click',e=>{ if(e.target===overlay) overlay.remove(); });
}

// ─── EDITOR ──────────────────────────────────────────────────────────────────
function buildEditor(){
  const ed=document.getElementById('editor');
  const d=state.days[selectedDate]||emptyDay();
  const dateObj=parseDate(selectedDate);
  const total=dayMinutes(d);
  const todayStr=fmt(startOfDay(new Date()));
  ed.innerHTML=`<div class="editor-head"><h3>${fmtRu(dateObj)} <span style="color:var(--ivory-dim);font-size:13px;">· ${WD_RU[(dateObj.getDay()+6)%7]}</span></h3><div class="nav-btns"><button id="prevDay">← пред.</button><button id="todayBtn">сегодня</button><button id="nextDay">след. →</button></div></div>${PLAN.map(p=>renderTask(p,d)).join('')}<div class="daytotal"><span style="color:var(--ivory-dim);font-size:13px;">Итого за день</span><span class="num" id="dayTotal">${total} мин · ${fmtHours(total)} ч</span><span class="savemsg" id="saveMsg">сохранено</span></div>`;
  document.getElementById('prevDay').onclick=()=>{ selectedDate=fmt(addDays(parseDate(selectedDate),-1)); buildEditor(); };
  document.getElementById('nextDay').onclick=()=>{ selectedDate=fmt(addDays(parseDate(selectedDate),1)); buildEditor(); };
  document.getElementById('todayBtn').onclick=()=>{ selectedDate=todayStr; buildEditor(); };
  PLAN.forEach(p=>{
    if(p.type==='check'){ const chk=ed.querySelector(`#chk-${p.key}`), inp=ed.querySelector(`#min-${p.key}`); chk.addEventListener('change',()=>updateField(p.key,'done',chk.checked,chk)); inp.addEventListener('change',()=>updateField(p.key,'min',clampNum(inp.value,0,300),inp)); }
    else{ const chk=ed.querySelector(`#chk-${p.key}`), inp=ed.querySelector(`#cnt-${p.key}`); if(chk) chk.addEventListener('change',()=>updateField(p.key,'done',chk.checked,chk)); inp.addEventListener('change',()=>updateField(p.key,'count',clampNum(inp.value,0,20),inp)); }
  });
}
function clampNum(v,min,max){ let n=parseInt(v,10); if(isNaN(n)) n=0; return Math.max(min,Math.min(max,n)); }
function renderTask(p,d){
  if(p.type==='check'){ const f=d[p.key]; return `<div class="task"><input type="checkbox" class="chk" id="chk-${p.key}" ${f.done?'checked':''}><div class="info"><b>${p.glyph} ${p.name}</b><span>${p.hint}</span></div><div><input type="number" id="min-${p.key}" min="0" max="300" value="${f.min}"><span class="unit">мин</span></div></div>`; }
  else{ const f=d[p.key]; const cnt=f.count||0; return `<div class="task"><input type="checkbox" class="chk" id="chk-${p.key}" ${f.done?'checked':''}><div class="info"><b>${p.glyph} ${p.name}</b><span>${p.hint} · ≈ ${cnt*20} мин</span></div><div><input type="number" id="cnt-${p.key}" min="0" max="20" value="${cnt}"><span class="unit">шт.</span></div></div>`; }
}

// ─── DAILY CHALLENGE COMPLETE ─────────────────────────────────────────────────
async function completeChallenge(){
  const todayStr = fmt(startOfDay(new Date()));
  if(state.challengeDoneDate === todayStr) return;
  const challenge = getDailyChallenge();
  state.challengeDoneDate = todayStr;
  // Apply bonus XP
  const bonus = Math.round(200 * challenge.bonus);
  state.xp += bonus;
  await persist();
  spawnFloatingXP(document.querySelector('.dc-done-btn'), `+${bonus} XP 🎯`, 'crit');
  spawnConfetti(document.querySelector('.dc-done-btn'), 30, true);
  playComplete();
  showToast({glyph:'🎯', name:'Вызов выполнен!', desc:`+${bonus} XP бонус за ежедневный вызов!`});
  document.querySelector('.dc-done-btn').disabled = true;
  document.querySelector('.dc-done-btn').textContent = '✅ Выполнено';
  refreshTopStats();
}

// ─── UPDATE FIELD ─────────────────────────────────────────────────────────────
async function updateField(key,field,value,el){
  if(!state.days[selectedDate]) state.days[selectedDate]=emptyDay();
  const day=state.days[selectedDate];
  const oldTotal=dayMinutes(day), oldComplete=dayComplete(day);
  const previousBest=state.bestDayMinutes||0;
  const statsBefore=computeStats(), combo=comboMultiplier(statsBefore.currentStreak);
  const oldLevel=levelInfo(state.xp).level;

  // Phoenix check: was previously zero/abandoned
  const wasAbandoned = oldTotal===0 && statsBefore.currentStreak===0;

  day[key][field]=value;
  const newTotal=dayMinutes(day), newComplete=dayComplete(day);

  let gained=Math.max(0,newTotal-oldTotal)*combo;
  if(field==='done'&&value===true) gained+=15*combo;
  let crit=false;
  if(gained>0&&Math.random()<0.15){ crit=true; gained+=Math.round(gained*0.5)+5; }

  // Challenge day bonus
  const todayStr=fmt(startOfDay(new Date()));
  const challengeActive = state.challengeDoneDate===todayStr;
  const challenge=getDailyChallenge();
  if(challengeActive&&gained>0) gained=Math.round(gained*challenge.bonus);

  let dayBonus=false;
  if(newComplete&&!oldComplete){ gained+=Math.round(50*combo); dayBonus=true; }
  gained=Math.round(gained);
  if(gained>0) state.xp+=gained;

  const isRecord=newTotal>previousBest;
  if(isRecord) state.bestDayMinutes=newTotal;

  const newLevel=levelInfo(state.xp).level;
  const ok=await persist();

  if(gained>0){ spawnFloatingXP(el,`+${gained} XP${crit?' 🎲':''}`,crit?'crit':''); spawnConfetti(el,crit?22:12,crit); crit?playCrit():playDing(); }
  if(dayBonus){
    showToast({glyph:'✅',name:'День завершён!',desc:`Бонус +${Math.round(50*combo)} XP за весь план`});
    playComplete();
    setTimeout(showBreakthroughPiece, 400);
  }
  if(isRecord&&newTotal>0&&newTotal>oldTotal) showToast({glyph:'🏅',name:'Новый рекорд дня',desc:`${fmtHours(newTotal)} ч за один день`});
  if(newLevel>oldLevel){ showLevelUp(newLevel); sendLevelUpNotification(newLevel); }

  // Phoenix: returning after streak break
  if(wasAbandoned && newTotal>0){ setTimeout(()=>{ showPhoenixFlash(); showToast({glyph:'🔥',name:'Ты вернулся!',desc:'+50 XP бонус за возвращение 🦅'}); state.xp+=50; persist(); }, 600); }

  // Boss kill check
  const newBoss=getBossHP();
  if(newBoss.hp===0&&dayBonus){
    setTimeout(()=>{ showToast({glyph:'⚔',name:`Босс повержен: ${newBoss.boss.name}!`,desc:`Рейтинг ${newBoss.boss.rating} — ты сильнее!`}); playBossKill(); spawnConfetti(null,60,true); }, 1000);
  }

  document.getElementById('dayTotal').textContent=`${newTotal} мин · ${fmtHours(newTotal)} ч`;
  if(key==='games'&&field==='count'){ const infoEl=document.querySelector(`#cnt-games`)?.closest('.task')?.querySelector('.info span'); if(infoEl) infoEl.textContent=`${PLAN.find(p=>p.key==='games').hint.split('·')[0]}· ≈ ${value*20} мин`; }
  const msg=document.getElementById('saveMsg');
  msg.classList.remove('err'); msg.textContent=ok?'сохранено':'ошибка'; if(!ok) msg.classList.add('err');
  msg.classList.add('show'); setTimeout(()=>msg.classList.remove('show'),1400);
  const cell=document.querySelector(`.cell[data-date="${selectedDate}"]`);
  if(cell){ cell.style.background=colorForMinutes(newTotal); cell.dataset.mins=newTotal; }
  refreshTopStats();
}

function refreshTopStats(){
  const stats=computeStats(), pct=Math.min(100,(stats.totalHours/GOAL_HOURS)*100), remaining=Math.max(0,GOAL_HOURS-stats.totalHours);
  const vals=document.querySelectorAll('.stat .value');
  if(vals.length>=4){ vals[0].innerHTML=`${stats.totalHours.toFixed(1)} <small>/ ${GOAL_HOURS}</small>`; vals[1].innerHTML=`${stats.currentStreak} <small>дн.</small>`; vals[2].innerHTML=`${stats.bestStreak} <small>дн.</small>`; vals[3].textContent=stats.games; }
  const fill=document.querySelector('.fill'); if(fill) fill.style.width=pct+'%';
  const row=document.querySelector('.goalbar .row b'); if(row) row.textContent=`${pct.toFixed(1)}% · осталось ${remaining.toFixed(0)} ч`;
  document.querySelectorAll('.achv').forEach(el=>{ const a=ACHIEVEMENTS.find(x=>x.id===el.dataset.id); el.classList.toggle('unlocked',a.check(stats)); });
  const lvl=levelInfo(state.xp), rank=getRank(lvl.level), combo=comboMultiplier(stats.currentStreak), xpPct=Math.min(100,(lvl.into/lvl.span)*100);
  const hud=document.querySelector('.levelhud');
  if(hud){ hud.querySelector('.rank-icon').textContent=rank.icon; hud.querySelector('.lvl-top').innerHTML=`<span>${rank.title} · Уровень <b>${lvl.level}</b></span><span><b>${lvl.into}</b> / ${lvl.span} XP</span>`; hud.querySelector('.xpfill').style.width=xpPct+'%'; hud.querySelector('.combo-pill').textContent=`🔥 ×${combo.toFixed(2)}`; hud.querySelector('.shield-pill').textContent=`🛡 ${state.shields||0}`; }
  syncUnlocked(stats,true);
  // Update boss HP fill
  const boss=getBossHP();
  const bFill=document.querySelector('.boss-hp-fill');
  if(bFill) bFill.style.width=boss.pct+'%';
}

async function syncUnlocked(stats,announce){
  const newlyUnlocked=[];
  ACHIEVEMENTS.forEach(a=>{ if(a.check(stats)&&!state.unlocked.includes(a.id)){ state.unlocked.push(a); newlyUnlocked.push(a); } });
  if(newlyUnlocked.length){ await persist(); if(announce) showToast(newlyUnlocked[0]); }
}

let toastTimer=null;
function showToast(a){
  const t=document.getElementById('toast');
  t.innerHTML=`<span class="glyph">${a.glyph}</span><div><b>${a.name}</b><span>${a.desc||''}</span></div>`;
  t.classList.add('show'); clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),4000);
}

function exportBackup(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=`chess-backup-${fmt(new Date())}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}
function importBackup(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=async ev=>{ try{ const parsed=JSON.parse(ev.target.result); if(!parsed.startDate||!parsed.days) throw new Error('bad'); state=parsed; state.unlocked=state.unlocked||[]; await persist(); render(); }catch{ alert('Не удалось прочитать резервную копию.'); } };
  reader.readAsText(file); e.target.value='';
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
(async function init(){
  await loadState();
  selectedDate=fmt(startOfDay(new Date()));
  render();
})();
</script>
